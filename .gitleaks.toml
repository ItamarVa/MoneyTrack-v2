title = "MoneyTrack gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "israeli-national-id"
description = "Israeli national ID (9 digits)"
regex = '''(?i)(?:ת\.?ז\.?|tz|teudat-zehut)[^0-9]{0,10}\b[0-9]{9}\b'''
tags = ["pii", "israel"]

[[rules]]
id = "israeli-bank-account-triplet"
description = "Israeli bank branch-account-check triplet"
regex = '''\b[0-9]{2,3}[-\s][0-9]{3,9}[-\s][0-9]{1,3}\b'''
tags = ["pii", "israel", "bank"]

[[rules]]
id = "israeli-card-prefix"
description = "Six-digit card BIN prefix in credential context"
regex = '''(?i)(?:card|isracard|visa|mastercard|amex)[^0-9]{0,10}\b[0-9]{6}\b'''
tags = ["pii", "israel", "card"]

[[rules]]
id = "moneytrack-vault-target"
description = "MoneyTrack Credential Manager target name with payload"
regex = '''(?i)moneytrack/(?:master-db-key|connection/[a-z0-9-]+)\s*[:=]\s*\S{8,}'''
tags = ["secret", "moneytrack"]

[allowlist]
paths = [
  '''\.gitleaks\.toml$''',
  '''memory/security\.md$''',
  '''memory/security-audit-.*\.md$''',
  '''packages/ingest/src/fixtures/''',
  '''packages/classify/src/fixtures/''',
]
# Matched against the extracted secret only (default regexTarget), anchored so nothing broader passes:
# a TS type name after `wrappedDbKey:` and the synthetic token in log-redaction.test.ts.
regexes = [
  '''^WrappedDbKeyB64$''',
  '''^(?:abcdef0123456789)+$''',
]
