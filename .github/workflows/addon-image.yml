name: Add-on image

on:
  push:
    branches: [main, v2/develop]
    paths:
      - "ha-addon/**"
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/addon-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: addon-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract add-on version
        id: meta
        run: |
          VERSION=$(grep '^version:' ha-addon/moneytrack/config.yaml | awk '{print $2}' | tr -d '"')
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${OWNER_LC}/moneytrack-amd64" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ha-addon/moneytrack/Dockerfile
          push: true
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/base-debian:bookworm
            BUILD_NODE=node:24-bookworm-slim
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
