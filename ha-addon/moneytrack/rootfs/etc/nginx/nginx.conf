worker_processes auto;
error_log /dev/stdout info;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout combined;
  sendfile on;
  keepalive_timeout 65;
  proxy_read_timeout 3600;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  upstream moneytrack_web {
    server 127.0.0.1:3100;
  }

  server {
    # IPv4 only: the Supervisor proxy is 172.30.32.2, and an IPv6 listen fails
    # to bind on hosts that boot with IPv6 disabled.
    listen 8099 default_server;

    allow 172.30.32.2;
    deny all;

    client_max_body_size 32m;

    # Supervisor forwards /api/hassio_ingress/<token>/<path> as /<path>, but Next
    # serves under that prefix (basePath), so it is re-added here. The include is
    # written by apply-base-path from the validated token; the X-Ingress-Path
    # request header is never trusted for routing.
    include /run/moneytrack/ingress-path.conf;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Ingress-Path $http_x_ingress_path;
    proxy_set_header X-Remote-User-Id $http_x_remote_user_id;
    proxy_set_header X-Remote-User-Name $http_x_remote_user_name;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # The panel opens <prefix>/, which Next 308-redirects to <prefix>, a URL HA
    # Core does not route (its ingress view needs the trailing slash).
    location = / {
      proxy_pass http://moneytrack_web$moneytrack_ingress_path$is_args$args;
    }

    location / {
      proxy_pass http://moneytrack_web$moneytrack_ingress_path$request_uri;
    }
  }
}
