name: MoneyTrack
version: "0.1.8"
slug: moneytrack
description: Personal finance tracking with bank sync (Home Assistant ingress)
url: https://github.com/ItamarVa/MoneyTrack-v2
arch:
  - amd64
startup: services
boot: auto
init: false
image: ghcr.io/itamarva/moneytrack-{arch}
hassio_api: true
homeassistant: null
ingress: true
ingress_port: 8099
panel_admin: false
panel_icon: mdi:cash-multiple
panel_title: MoneyTrack
map:
  - share:rw
options:
  allowed_users: []
  clear_lockouts: false
schema:
  allowed_users:
    - str
  clear_lockouts: bool
backup: hot
backup_exclude:
  - puppeteer/**
  - logs/**
backup_pre: /moneytrack/scripts/backup-pre.sh
ports: {}
ports_description: {}
uart: false
usb: false
host_network: false
privileged: []
full_access: false
apparmor: true
